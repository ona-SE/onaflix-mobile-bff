services:
  mobile-bff:
    name: Mobile BFF Dev Server
    description: Express dev server with ts-node
    triggeredBy:
      - postDevcontainerStart
    commands:
      start: npm run dev
      ready: curl -s http://localhost:3005/health

  redis:
    name: Redis
    description: Redis server for caching
    triggeredBy:
      - postDevcontainerStart
    commands:
      start: docker run --rm --name onaflix-redis -p 6379:6379 redis:7-alpine
      ready: docker exec onaflix-redis redis-cli ping

tasks:
  install-dependencies:
    name: Install Dependencies
    description: Install npm packages
    triggeredBy:
      - postDevcontainerStart
    commands:
      start: npm install

  build:
    name: Build TypeScript
    description: Compile TypeScript to JavaScript
    commands:
      start: npm run build

  test:
    name: Run Tests
    description: Run Jest test suite
    commands:
      start: npm test

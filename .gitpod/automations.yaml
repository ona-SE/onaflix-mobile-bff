services:
  mobile-bff:
    name: Mobile BFF Dev Server
    description: Express dev server with ts-node on port 3005
    triggeredBy:
      - postDevcontainerStart
    commands:
      start: npm run dev
      ready: curl -s http://localhost:3005/health

tasks:
  install-dependencies:
    name: Install Dependencies
    description: Install npm packages
    triggeredBy:
      - postDevcontainerStart
    command: npm install
